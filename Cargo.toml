[workspace]
resolver = "2"
members = ["crates/bundlewhy"]

[workspace.dependencies]
libc = "0.2.182"
serde = "1.0.219"
sha2 = "0.11.0"
tempfile = "3.14.0"
thiserror = "2"
tokio = "1.48.0"
tracing = "0.1.43"
uuid = "1.18.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
