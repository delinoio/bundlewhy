name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Optional base revision for affected validation
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Resolve affected comparison
        id: comparison
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          MANUAL_BASE: ${{ inputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            push)
              base="$PUSH_BASE"
              if [[ "$base" =~ ^0+$ ]]; then
                empty_tree="$(git hash-object -t tree /dev/null)"
                base="$(git -c user.name=CI -c user.email=ci@example.invalid commit-tree "$empty_tree" -m 'Empty comparison')"
              fi
              ;;
            workflow_dispatch)
              if [[ -n "$MANUAL_BASE" ]]; then
                base="$(git rev-parse --verify --end-of-options "${MANUAL_BASE}^{commit}")"
              else
                base="$(git merge-base origin/main "$head")"
              fi
              ;;
            *) exit 1 ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "Validation revision: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Comparison: $base..$head" >> "$GITHUB_STEP_SUMMARY"
      - name: Check formatting
        env:
          TURBO_SCM_BASE: ${{ steps.comparison.outputs.base }}
          TURBO_SCM_HEAD: ${{ steps.comparison.outputs.head }}
        run: pnpm format:check
      - name: Test formatting and hooks
        run: pnpm test:tooling
      - name: Select affected bundlewhy validation
        id: bundlewhy
        env:
          BASE: ${{ steps.comparison.outputs.base }}
          HEAD: ${{ steps.comparison.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE" "$HEAD" -- apps packages crates protos Cargo.toml Cargo.lock rust-toolchain .rustfmt.toml go.mod go.sum buf.yaml buf.gen.yaml package.json pnpm-lock.yaml pnpm-workspace.yaml turbo.json scripts .github/workflows/CI.yml; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            status="$?"
            if [[ "$status" != 1 ]]; then exit "$status"; fi
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@v1
        if: steps.bundlewhy.outputs.run == 'true'
        with:
          toolchain: nightly-2026-09-28
          components: rustfmt, clippy
      - uses: actions/setup-go@v6
        if: steps.bundlewhy.outputs.run == 'true'
        with:
          go-version-file: go.mod
      - name: Check schemas and generated bindings
        if: steps.bundlewhy.outputs.run == 'true'
        env:
          BASE: ${{ steps.comparison.outputs.base }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          pnpm proto:lint
          if git cat-file -e "$BASE:buf.yaml" 2>/dev/null; then
            pnpm exec buf breaking --against ".git#ref=$BASE"
          else
            echo "No schema baseline exists; this revision establishes v1."
          fi
          pnpm proto:generate
          git diff --exit-code -- protos/gen apps/bundlewhy-web/src/gen
          test -z "$(git ls-files --others --exclude-standard -- protos/gen apps/bundlewhy-web/src/gen)"
          go test ./protos/gen/go/...
      - name: Test the UI, adapters, launcher and guides
        if: steps.bundlewhy.outputs.run == 'true'
        run: pnpm test
      - name: Test the Rust core and CLI
        if: steps.bundlewhy.outputs.run == 'true'
        run: |
          cargo fmt --all --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Run fixture acceptance
        if: steps.bundlewhy.outputs.run == 'true'
        run: pnpm --filter @delino/bundlewhy test:acceptance
      - name: Remove generated UI output
        if: always()
        run: rm -rf "apps/bundlewhy-web/dist"
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          {
            echo 'Commands: pnpm install --frozen-lockfile --ignore-scripts; pnpm format:check; pnpm test:tooling; affected schema, Go, Node, Rust and fixture checks'
            echo "Result: $RESULT"
            echo 'Fixture acceptance covers local Vite and Rspack builds. Cross-platform native, account, public hosting and release acceptance are not performed.'
          } >> "$GITHUB_STEP_SUMMARY"
